name: Build PDF

# 只允许手动运行。
# push、commit、tag 都不会自动触发。
on:
  workflow_dispatch:
    inputs:

      mode:
        description: "运行模式：test 只生成 PDF；publish 同时发布到 Releases"
        required: true
        default: test
        type: choice
        options:
          - test
          - publish

      version:
        description: "仅 publish 模式填写，例如 v0.1.0；test 模式留空"
        required: false
        type: string

      font_size:
        description: "正文字号（pt）"
        required: true
        default: "18"
        type: string

      line_height:
        description: "正文行距（pt）"
        required: true
        default: "27"
        type: string

      margin_mm:
        description: "页边距（mm）"
        required: true
        default: "20"
        type: string


# publish 模式创建 Release 需要写权限。
# test 模式不会实际进行写入。
permissions:
  contents: write


jobs:

  build-pdf:

    # 固定 Ubuntu 版本，避免 ubuntu-latest 未来变化影响排版。
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. 下载仓库
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. 检查输入参数
      # ============================================================

      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          FONT_SIZE: ${{ inputs.font_size }}
          LINE_HEIGHT: ${{ inputs.line_height }}
          MARGIN_MM: ${{ inputs.margin_mm }}
          GH_TOKEN: ${{ github.token }}

        run: |

          echo "运行模式：$MODE"
          echo "正文字号：$FONT_SIZE pt"
          echo "正文行距：$LINE_HEIGHT pt"
          echo "页边距：$MARGIN_MM mm"

          # --------------------------------------------------------
          # 检查字号
          # --------------------------------------------------------

          if [[ ! "$FONT_SIZE" =~ ^[0-9]+$ ]]; then
            echo "font_size 必须是整数。"
            exit 1
          fi

          if (( FONT_SIZE < 12 || FONT_SIZE > 30 )); then
            echo "font_size 建议范围：12 - 30"
            exit 1
          fi


          # --------------------------------------------------------
          # 检查行距
          # --------------------------------------------------------

          if [[ ! "$LINE_HEIGHT" =~ ^[0-9]+$ ]]; then
            echo "line_height 必须是整数。"
            exit 1
          fi

          if (( LINE_HEIGHT < FONT_SIZE + 2 || LINE_HEIGHT > 50 )); then
            echo "line_height 必须至少比字号大 2pt，且不能超过 50pt。"
            exit 1
          fi


          # --------------------------------------------------------
          # 检查页边距
          # --------------------------------------------------------

          if [[ ! "$MARGIN_MM" =~ ^[0-9]+$ ]]; then
            echo "margin_mm 必须是整数。"
            exit 1
          fi

          if (( MARGIN_MM < 10 || MARGIN_MM > 35 )); then
            echo "margin_mm 建议范围：10 - 35"
            exit 1
          fi


          # --------------------------------------------------------
          # publish 模式才检查版本号
          # --------------------------------------------------------

          if [[ "$MODE" == "publish" ]]; then

            if [[ -z "$VERSION" ]]; then
              echo "publish 模式必须填写版本号。"
              echo "例如：v0.1.0"
              exit 1
            fi

            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "版本号格式错误：$VERSION"
              echo "请使用类似：v0.1.0、v0.2.0、v1.0.0"
              exit 1
            fi

            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "Release $VERSION 已经存在。"
              echo "请换一个新的版本号。"
              exit 1
            fi

            echo "准备发布正式版本：$VERSION"

          else

            echo "当前为测试模式。"
            echo "不会创建 tag。"
            echo "不会创建 Release。"

          fi


      # ============================================================
      # 3. 安装 PDF 工具
      #
      # 字体：
      #
      # Noto Serif CJK SC
      # Noto Sans CJK SC
      # Noto Mono
      #
      # 均为开源字体。
      # ============================================================

      - name: Install PDF tools
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            fonts-noto-cjk \
            fonts-noto-mono \
            qpdf


      # ============================================================
      # 4. 整理章节
      #
      # content/01xxx.md
      # content/02xxx.md
      # ...
      #
      # 自动按照数字排序。
      #
      # Markdown 顶部 YAML front matter 不进入 PDF。
      #
      # 最后一章：
      # 二级及以下标题仍显示在正文中，
      # 但不进入目录。
      # ============================================================

      - name: Assemble chapters
        run: |

          mkdir -p build

          python3 - <<'PY'

          from pathlib import Path
          import re


          # --------------------------------------------------------
          # 找出章节
          # --------------------------------------------------------

          files = sorted(
              Path("content").glob("[0-9][0-9]*.md"),
              key=lambda p: int(p.name[:2])
          )


          if not files:
              raise SystemExit("没有找到章节文件")


          chapters = []


          # --------------------------------------------------------
          # 逐章处理
          # --------------------------------------------------------

          for index, path in enumerate(files):

              text = path.read_text(
                  encoding="utf-8"
              )


              # 默认标题使用文件名
              title = path.stem

              body = text


              # ----------------------------------------------------
              # 解析 YAML front matter
              # ----------------------------------------------------

              match = re.match(
                  r"^---\s*\n(.*?)\n---\s*\n?(.*)$",
                  text,
                  re.S
              )


              if match:

                  front_matter, body = match.groups()


                  title_match = re.search(
                      r'^title:\s*(.+?)\s*$',
                      front_matter,
                      re.M
                  )


                  if title_match:

                      title = title_match.group(1)

                      title = (
                          title
                          .strip()
                          .strip('"')
                          .strip("'")
                      )


              # ----------------------------------------------------
              # 最后一章：
              #
              # 保留二级及以下标题，
              # 但增加 Pandoc 的 .unlisted 属性，
              # 从 PDF 目录中隐藏。
              # ----------------------------------------------------

              if index == len(files) - 1:

                  def hide_from_toc(match):

                      hashes = match.group(1)

                      heading = (
                          match
                          .group(2)
                          .rstrip()
                      )


                      # 标题已经有 Pandoc 属性
                      attr_match = re.match(
                          r"^(.*?)(\s+\{([^}]*)\})$",
                          heading
                      )


                      if attr_match:

                          heading_text = (
                              attr_match
                              .group(1)
                          )

                          attrs = (
                              attr_match
                              .group(3)
                          )


                          if ".unlisted" not in attrs:

                              attrs = (
                                  attrs
                                  + " .unlisted"
                              )


                          return (
                              f"{hashes} "
                              f"{heading_text} "
                              f"{{{attrs.strip()}}}"
                          )


                      # 没有属性
                      return (
                          f"{hashes} "
                          f"{heading} "
                          "{.unlisted}"
                      )


                  body = re.sub(
                      r"^(#{2,6})\s+(.+?)\s*$",
                      hide_from_toc,
                      body,
                      flags=re.M
                  )


              # ----------------------------------------------------
              # 写入整本书
              # ----------------------------------------------------

              chapters.append(
                  f"# {title}\n\n"
                  f"{body.strip()}\n"
              )


              print(
                  "加入章节:",
                  path
              )


          # --------------------------------------------------------
          # 输出临时 Markdown
          # --------------------------------------------------------

          Path(
              "build/book.md"
          ).write_text(
              "\n\n".join(chapters),
              encoding="utf-8"
          )

          PY


      # ============================================================
      # 5. 生成 PDF 排版配置
      #
      # 字号、行距可以直接从 Run workflow 页面调整。
      #
      # 标题字号会根据正文字号自动变化。
      # ============================================================

      - name: Create PDF style
        env:
          FONT_SIZE: ${{ inputs.font_size }}
          LINE_HEIGHT: ${{ inputs.line_height }}

        run: |

          python3 - <<'PY'

          from pathlib import Path
          import os


          font_size = int(
              os.environ["FONT_SIZE"]
          )

          line_height = int(
              os.environ["LINE_HEIGHT"]
          )


          # --------------------------------------------------------
          # 标题尺寸自动跟随正文
          # --------------------------------------------------------

          chapter_size = font_size + 12

          chapter_line = line_height + 13


          section_size = font_size + 5

          section_line = line_height + 5


          subsection_size = font_size + 2

          subsection_line = line_height + 2


          # --------------------------------------------------------
          # LaTeX 模板
          # --------------------------------------------------------

          template = r"""
          \usepackage{fancyhdr}
          \usepackage{indentfirst}


          % --------------------------------------------------------
          % 页码
          % --------------------------------------------------------

          \pagestyle{fancy}

          \fancyhf{}

          \fancyfoot[C]{\thepage}

          \renewcommand{\headrulewidth}{0pt}


          % 章节首页也显示页码
          \fancypagestyle{plain}{

            \fancyhf{}

            \fancyfoot[C]{\thepage}

            \renewcommand{\headrulewidth}{0pt}

          }


          % --------------------------------------------------------
          % 段落
          % --------------------------------------------------------

          \setlength{\parindent}{2em}

          \setlength{\parskip}{0.35em}


          % --------------------------------------------------------
          % 正文字号
          % --------------------------------------------------------

          \makeatletter

          \renewcommand\normalsize{

            \@setfontsize
              \normalsize
              {__FONT_SIZE__pt}
              {__LINE_HEIGHT__pt}

          }

          \makeatother

          \normalsize


          % --------------------------------------------------------
          % 标题
          % --------------------------------------------------------

          \ctexset{

            chapter={

              format={
                \raggedright
                \bfseries
                \fontsize
                  {__CHAPTER_SIZE__pt}
                  {__CHAPTER_LINE__pt}
                \selectfont
              },

              beforeskip=12pt,

              afterskip=26pt

            },

            section={

              format={
                \raggedright
                \bfseries
                \fontsize
                  {__SECTION_SIZE__pt}
                  {__SECTION_LINE__pt}
                \selectfont
              }

            },

            subsection={

              format={
                \raggedright
                \bfseries
                \fontsize
                  {__SUBSECTION_SIZE__pt}
                  {__SUBSECTION_LINE__pt}
                \selectfont
              }

            }

          }
          """


          replacements = {

              "__FONT_SIZE__":
                  str(font_size),

              "__LINE_HEIGHT__":
                  str(line_height),

              "__CHAPTER_SIZE__":
                  str(chapter_size),

              "__CHAPTER_LINE__":
                  str(chapter_line),

              "__SECTION_SIZE__":
                  str(section_size),

              "__SECTION_LINE__":
                  str(section_line),

              "__SUBSECTION_SIZE__":
                  str(subsection_size),

              "__SUBSECTION_LINE__":
                  str(subsection_line),

          }


          for old, new in replacements.items():

              template = template.replace(
                  old,
                  new
              )


          Path(
              "build/header.tex"
          ).write_text(
              template,
              encoding="utf-8"
          )


          print(
              f"正文："
              f"{font_size}pt / "
              f"{line_height}pt"
          )

          print(
              f"章节标题："
              f"{chapter_size}pt"
          )

          print(
              f"二级标题："
              f"{section_size}pt"
          )

          PY


      # ============================================================
      # 6. 生成正文 PDF
      #
      # 使用开源 Noto 字体：
      #
      # 正文：
      # Noto Serif CJK SC
      #
      # 无衬线：
      # Noto Sans CJK SC
      #
      # 等宽：
      # Noto Mono
      # ============================================================

      - name: Build book body
        env:
          MARGIN_MM: ${{ inputs.margin_mm }}

        run: |

          pandoc \
            build/book.md \
            --standalone \
            --toc \
            --toc-depth=2 \
            --top-level-division=chapter \
            --pdf-engine=xelatex \
            -V documentclass=ctexbook \
            -V classoption="openany,oneside" \
            -V papersize=a4 \
            -V geometry:margin=${MARGIN_MM}mm \
            -V mainfont="Noto Serif CJK SC" \
            -V CJKmainfont="Noto Serif CJK SC" \
            -V sansfont="Noto Sans CJK SC" \
            -V monofont="Noto Mono" \
            -H build/header.tex \
            -o build/body.pdf


      # ============================================================
      # 7. 生成封面
      #
      # content/cover.jpg
      #
      # 独占 A4 第一页。
      # 不显示页码。
      # ============================================================

      - name: Build cover
        run: |

          cat > build/cover.tex <<'EOF'

          \documentclass{article}

          \usepackage[
            a4paper,
            margin=0pt
          ]{geometry}

          \usepackage{graphicx}

          \usepackage{eso-pic}

          \pagestyle{empty}


          \begin{document}


          \AddToShipoutPictureBG*{

            \AtPageLowerLeft{

              \includegraphics[
                width=\paperwidth,
                height=\paperheight
              ]{content/cover.jpg}

            }

          }


          \null


          \end{document}

          EOF


          xelatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory=build \
            build/cover.tex


      # ============================================================
      # 8. 生成尾页
      #
      # test：
      # 版本显示“测试版（未发布）”
      #
      # publish：
      # 显示真正版本号
      #
      # 时间固定显示 UTC+8。
      # ============================================================

      - name: Build colophon
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}

        run: |

          python3 - <<'PY'

          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os


          mode = os.environ["MODE"]

          version = os.environ.get(
              "VERSION",
              ""
          )


          if mode == "publish":

              display_version = version

          else:

              display_version = (
                  "测试版（未发布）"
              )


          generated_at = (
              datetime.now(
                  ZoneInfo(
                      "Asia/Shanghai"
                  )
              )
              .strftime(
                  "%Y-%m-%d %H:%M:%S"
              )
          )


          git_sha = os.environ.get(
              "GITHUB_SHA",
              ""
          )


          short_sha = (
              git_sha[:7]
              if git_sha
              else "unknown"
          )


          template = r"""
          \documentclass{article}


          \usepackage[
            a4paper,
            margin=25mm
          ]{geometry}


          \usepackage{fontspec}

          \usepackage{xeCJK}


          % --------------------------------------------------------
          % 开源字体
          % --------------------------------------------------------

          \setmainfont{
            Noto Serif CJK SC
          }

          \setCJKmainfont{
            Noto Serif CJK SC
          }


          \pagestyle{empty}


          \begin{document}


          \vspace*{\fill}


          \begin{center}


          {
            \fontsize{28pt}{40pt}
            \selectfont
            \bfseries

            关于本电子版
          }


          \vspace{3em}


          {
            \fontsize{18pt}{30pt}
            \selectfont


            书名：《免费活着》
            \\[0.9em]


            英文名：Living for Free
            \\[0.9em]


            作者：王正阳
            \\[0.9em]


            版本：__VERSION__
            \\[0.9em]


            PDF 生成时间：
            __GENERATED_AT__
            \\[0.3em]


            UTC+8
            \\[0.9em]


            源码版本：
            __GIT_SHA__
            \\[0.9em]


            项目地址：
            \\[0.4em]


            github.com/meixiaoqiu/LivingForFree

          }


          \vspace{3em}


          {
            \fontsize{13pt}{22pt}
            \selectfont

            本 PDF 由 GitHub Actions
            \\

            根据项目仓库中的 Markdown 书稿自动生成。

          }


          \end{center}


          \vspace*{\fill}


          \end{document}
          """


          template = (
              template
              .replace(
                  "__VERSION__",
                  display_version
              )
              .replace(
                  "__GENERATED_AT__",
                  generated_at
              )
              .replace(
                  "__GIT_SHA__",
                  short_sha
              )
          )


          Path(
              "build/colophon.tex"
          ).write_text(
              template,
              encoding="utf-8"
          )


          print(
              "尾页版本：",
              display_version
          )

          print(
              "PDF 生成时间：",
              generated_at
          )

          PY


          xelatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory=build \
            build/colophon.tex


      # ============================================================
      # 9. 合并 PDF
      #
      # 封面
      # +
      # 正文
      # +
      # 尾页
      # ============================================================

      - name: Merge PDF
        run: |

          qpdf \
            --empty \
            --pages \
            build/cover.pdf 1 \
            build/body.pdf 1-z \
            build/colophon.pdf 1 \
            -- \
            build/LivingForFree.pdf


          echo "最终 PDF："

          ls -lh \
            build/LivingForFree.pdf


      # ============================================================
      # 10. 上传到 Actions
      #
      # test / publish 两种模式都会执行。
      #
      # archive: false
      # 表示直接上传 PDF，
      # 不套一层 ZIP。
      # ============================================================

      - name: Upload PDF to Actions
        id: upload-pdf

        uses: actions/upload-artifact@v7

        with:
          path: build/LivingForFree.pdf
          archive: false
          retention-days: 30
          if-no-files-found: error


      # ============================================================
      # 11. 输出构建摘要
      #
      # 在 Action 页面直接显示：
      #
      # 模式
      # 字号
      # 行距
      # 页边距
      # PDF 下载地址
      # ============================================================

      - name: Build summary
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          FONT_SIZE: ${{ inputs.font_size }}
          LINE_HEIGHT: ${{ inputs.line_height }}
          MARGIN_MM: ${{ inputs.margin_mm }}
          ARTIFACT_URL: ${{ steps.upload-pdf.outputs.artifact-url }}

        run: |

          echo "## 《免费活着》PDF 构建完成" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 模式：$MODE" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 正文字号：${FONT_SIZE}pt" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 行距：${LINE_HEIGHT}pt" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 页边距：${MARGIN_MM}mm" \
            >> "$GITHUB_STEP_SUMMARY"


          if [[ "$MODE" == "publish" ]]; then

            echo "- 发布版本：$VERSION" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "- 发布状态：测试版，不创建 Release" \
              >> "$GITHUB_STEP_SUMMARY"

          fi


          echo "" \
            >> "$GITHUB_STEP_SUMMARY"


          echo "[下载生成的 PDF]($ARTIFACT_URL)" \
            >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 12. 正式发布
      #
      # 只有：
      #
      # mode = publish
      #
      # 才执行。
      #
      # test 模式直接跳过。
      # ============================================================

      - name: Create GitHub Release

        if: ${{ inputs.mode == 'publish' }}

        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

        run: |

          gh release create "$VERSION" \
            "build/LivingForFree.pdf#《免费活着》PDF" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "《免费活着》 $VERSION" \
            --notes "《免费活着》PDF 电子版。"